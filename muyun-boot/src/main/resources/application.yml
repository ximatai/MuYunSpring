# The platform's HTTP surface has one host-level mount point.  It deliberately
# applies to every MVC endpoint and WebSocket handshake, rather than relying on
# per-controller path prefixes that dynamic endpoints could bypass.
server:
  servlet:
    context-path: ${MUYUN_API_CONTEXT_PATH:/api}
logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level traceId=%X{traceId:-} endpointId=%X{endpointId:-} moduleAlias=%X{moduleAlias:-} actionCode=%X{actionCode:-} %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level traceId=%X{traceId:-} endpointId=%X{endpointId:-} moduleAlias=%X{moduleAlias:-} actionCode=%X{actionCode:-} %logger{36} - %msg%n"
