name: Release to Maven Central

on:
  push:
    tags:
      - "v*.*.*"

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish release artifacts
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      SONATYPE_TOKEN: ${{ secrets.SONATYPE_TOKEN }}
      SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
      SIGNING_KEY_ID: ${{ secrets.SIGNING_KEY_ID }}
      SIGNING_SECRET_KEY: ${{ secrets.SIGNING_SECRET_KEY }}
      SIGNING_SECRET_KEY_BASE64: ${{ secrets.SIGNING_SECRET_KEY_BASE64 }}
      SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

    steps:
      - uses: actions/checkout@v7

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: muyun-web/.nvmrc
          cache: npm
          cache-dependency-path: muyun-web/package-lock.json
          registry-url: https://registry.npmjs.org

      - name: Verify release tag and credentials
        run: ./gradlew verifyReleaseTagVersion verifyReleaseCredentials

      # Start verification from a clean tree. The consumer verification below
      # prepares the npm staging package that both dry-run and publish consume.
      # Do not clean again between those steps and npm publish.
      - name: Clean release workspace
        run: ./gradlew clean

      - name: Verify backend
        run: ./gradlew verifyAll

      - name: Verify published artifact consumer
        run: ./gradlew verifyPublishedConsumer

      - name: Verify npm package consumer
        run: |
          npm ci --prefix muyun-web
          npm run verify:consumer --prefix muyun-web

      - name: Verify npm publish payload
        working-directory: build/consumer-npm/staging/web-app
        run: npm publish --dry-run --access public

      - name: Publish to Maven Central
        run: ./gradlew publishReleaseToSonatype

      - name: Publish to npm
        working-directory: build/consumer-npm/staging/web-app
        run: npm publish --access public
