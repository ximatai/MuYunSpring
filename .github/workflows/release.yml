name: Release platform artifacts

on:
  workflow_dispatch:
    inputs:
      recover-run-id:
        description: "Original failed release run (resume existing Maven deployment; never re-upload)"
        required: true
        type: string
  push:
    tags:
      - "v*.*.*"

concurrency:
  group: release-${{ inputs.recover-run-id || github.ref_name }}
  cancel-in-progress: false

jobs:
  verify-maven:
    if: github.event_name == 'push'
    name: Verify backend and Maven consumer
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: muyun-web/.nvmrc

      - name: Verify release tag and notes
        run: |
          node scripts/version.mjs verify-release "$GITHUB_REF_NAME"
          node scripts/github-release-notes.mjs "$GITHUB_REF_NAME" < docs/CHANGELOG.md > /dev/null
          ./gradlew verifyReleaseTagVersion

      - name: Test release tooling
        run: node --test scripts/*.test.mjs

      - name: Clean release workspace
        run: ./gradlew clean

      - name: Check for completed main backend CI
        id: backend-ci
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/reuse-backend-ci.mjs "$(git rev-parse HEAD)"

      - name: Verify backend
        if: steps.backend-ci.outputs.reused != 'true'
        run: ./gradlew verifyAll

      - name: Verify published artifact consumer
        run: ./gradlew verifyPublishedConsumer

  verify-npm:
    if: github.event_name == 'push'
    name: Verify npm package consumer
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      npm-artifact-id: ${{ steps.npm-package.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: muyun-web/.nvmrc
          cache: npm
          cache-dependency-path: muyun-web/package-lock.json

      - name: Verify release version
        run: |
          node scripts/version.mjs verify-release "$GITHUB_REF_NAME"
          echo "MUYUN_RELEASE_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Verify npm package consumer
        run: |
          npm ci --prefix muyun-web
          npm run verify:consumer --prefix muyun-web

      - name: Verify npm publish payload
        working-directory: build/consumer-npm
        run: npm publish "./ximatai-muyun-web-app-${MUYUN_RELEASE_VERSION}.tgz" --dry-run --access public --registry=https://registry.npmjs.org/

      - name: Upload verified npm package
        id: npm-package
        uses: actions/upload-artifact@v7
        with:
          name: npm-package-${{ github.ref_name }}-attempt-${{ github.run_attempt }}
          path: build/consumer-npm/ximatai-muyun-web-app-${{ env.MUYUN_RELEASE_VERSION }}.tgz
          if-no-files-found: error

  publish-maven:
    name: Publish to Maven Central
    needs: [verify-maven, verify-npm]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: muyun-web/.nvmrc

      - name: Publish to Maven Central
        env:
          SONATYPE_TOKEN: ${{ secrets.SONATYPE_TOKEN }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
          SIGNING_KEY_ID: ${{ secrets.SIGNING_KEY_ID }}
          SIGNING_SECRET_KEY: ${{ secrets.SIGNING_SECRET_KEY }}
          SIGNING_SECRET_KEY_BASE64: ${{ secrets.SIGNING_SECRET_KEY_BASE64 }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: ./gradlew publishReleaseToSonatype -Pmuyun.mavenCentralRelease=true

      - name: Record Maven publication usage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: maven-publication-${{ github.ref_name }}-attempt-${{ github.run_attempt }}
          path: |
            build/maven-central/report.json
            build/sonayUploader/uploaderId
          if-no-files-found: ignore

  publish-npm:
    name: Publish to npm
    needs: [verify-npm, publish-maven]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - name: Set up Node.js for npm Trusted Publishing
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Download verified npm package
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.verify-npm.outputs.npm-artifact-id }}

      - name: Publish verified npm package
        run: npm publish "./ximatai-muyun-web-app-${GITHUB_REF_NAME#v}.tgz" --access public --registry=https://registry.npmjs.org/

  recover-maven:
    name: Confirm existing Maven deployment
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      release-tag: ${{ steps.source.outputs.release-tag }}
      npm-artifact-id: ${{ steps.source.outputs.npm-artifact-id }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Validate original release and artifacts
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.recover-run-id }}
        run: node scripts/recover-release.mjs plan "$SOURCE_RUN_ID"
      - name: Test recovery orchestration
        run: node --test scripts/recover-release.test.mjs
      - name: Download original Maven deployment receipt
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ steps.source.outputs.maven-artifact-id }}
          run-id: ${{ inputs.recover-run-id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/maven-publication
      - name: Wait for original deployment (read only)
        env:
          SONATYPE_TOKEN: ${{ secrets.SONATYPE_TOKEN }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
        run: node scripts/wait-maven-central.mjs "$RUNNER_TEMP/maven-publication/sonayUploader/uploaderId"

  recover-npm:
    name: Publish original verified npm package
    needs: recover-maven
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      id-token: write
    outputs:
      release-tag: ${{ needs.recover-maven.outputs.release-tag }}
    env:
      RELEASE_TAG: ${{ needs.recover-maven.outputs.release-tag }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Download original verified npm package
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.recover-maven.outputs.npm-artifact-id }}
          run-id: ${{ inputs.recover-run-id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/npm-package
      - name: Reconcile and publish verified npm package
        run: node scripts/recover-release.mjs publish-npm "$RUNNER_TEMP/npm-package/ximatai-muyun-web-app-${RELEASE_TAG#v}.tgz"

  github-release:
    name: Publish GitHub Release
    needs: [publish-maven, publish-npm, recover-npm]
    if: ${{ always() && ((needs.publish-maven.result == 'success' && needs.publish-npm.result == 'success') || needs.recover-npm.result == 'success') }}
    env:
      RELEASE_TAG: ${{ needs.recover-npm.outputs.release-tag || github.ref_name }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: muyun-web/.nvmrc

      - name: Synchronize release notes
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          notes_file="$RUNNER_TEMP/muyun-release-notes.md"
          node scripts/github-release-notes.mjs "$RELEASE_TAG" < docs/CHANGELOG.md > "$notes_file"
          title="MuYunSpring ${RELEASE_TAG#v}"
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
              --title "$title" --notes-file "$notes_file" --draft=false --prerelease=false
          else
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
              --verify-tag --title "$title" --notes-file "$notes_file"
          fi

  advance-development-version:
    name: Advance development version
    needs: [publish-maven, publish-npm, recover-npm]
    if: ${{ always() && ((needs.publish-maven.result == 'success' && needs.publish-npm.result == 'success') || needs.recover-npm.result == 'success') }}
    env:
      RELEASE_TAG: ${{ needs.recover-npm.outputs.release-tag || github.ref_name }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: development-version-maintenance
      cancel-in-progress: false
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Advance aligned development version
        shell: bash
        run: |
          set -euo pipefail
          release_version="${RELEASE_TAG#v}"
          node scripts/version.mjs advance "$release_version"
          node scripts/version.mjs check

          if git diff --quiet -- gradle.properties muyun-web/package.json muyun-web/package-lock.json; then
            echo "Development version was already advanced."
            exit 0
          fi

          unexpected="$(git diff --name-only | grep -Ev '^(gradle\.properties|muyun-web/package(-lock)?\.json)$' || true)"
          if [[ -n "$unexpected" ]]; then
            echo "Unexpected files changed while advancing the version:" >&2
            echo "$unexpected" >&2
            exit 1
          fi

          next_version="$(sed -n 's/^muyunVersion=//p' gradle.properties)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gradle.properties muyun-web/package.json muyun-web/package-lock.json
          git commit -m "chore: 推进 ${next_version} 开发版本"
          git push origin HEAD:main
