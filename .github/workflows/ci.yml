name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect changed areas
        id: filter
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.event.pull_request.head.sha }}"
            merge_base="$(git merge-base "$base" "$head")"
            changed_files="$(git diff --name-only "$merge_base" "$head")"
          else
            base="${{ github.event.before }}"
            head="${{ github.sha }}"
            if [[ "$base" =~ ^0+$ ]]; then
              changed_files="$(git ls-tree -r --name-only "$head")"
            else
              changed_files="$(git diff --name-only "$base" "$head")"
            fi
          fi

          backend=false
          frontend=false

          while IFS= read -r file; do
            [[ -z "$file" ]] && continue

            case "$file" in
              .github/workflows/ci.yml | .github/workflows/release.yml | .github/workflows/version-rollover.yml | \
              scripts/version.mjs | scripts/version-lib.mjs | scripts/version.test.mjs | \
              scripts/maven-publication* | scripts/wait-maven-central.mjs | scripts/github-release* | scripts/reuse-backend-ci* | \
              build.gradle | build.gradle.kts | settings.gradle | settings.gradle.kts | gradle.properties | \
              gradle/* | gradlew | gradlew.bat | \
              muyun-common/* | muyun-ability/* | muyun-dynamic/* | \
              muyun-platform/* | muyun-iam/* | muyun-web-adapter/* | \
              muyun-platform-web/* | muyun-iam-web/* | muyun-dynamic-web/* | \
              muyun-spring-bom/* | muyun-spring-boot-starter/* | muyun-boot/*)
                backend=true
                ;;
            esac

            case "$file" in
              .github/workflows/ci.yml | .github/workflows/release.yml | .github/workflows/version-rollover.yml | \
              gradle.properties | scripts/version.mjs | scripts/version-lib.mjs | scripts/version.test.mjs | \
              muyun-web/* | docs/frontend/*)
                frontend=true
                ;;
            esac
          done <<< "$changed_files"

          {
            echo "backend=$backend"
            echo "frontend=$frontend"
          } >> "$GITHUB_OUTPUT"

  backend:
    name: Backend Build & Test (Java 21)
    needs: changes
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        if: needs.changes.outputs.backend == 'true'
        uses: actions/checkout@v7

      - name: Set up Java 21
        if: needs.changes.outputs.backend == 'true'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        if: needs.changes.outputs.backend == 'true'
        uses: gradle/actions/setup-gradle@v6

      - name: Set up Node.js for publication verification
        if: needs.changes.outputs.backend == 'true'
        uses: actions/setup-node@v7
        with:
          node-version-file: muyun-web/.nvmrc

      - name: Test release tooling
        if: needs.changes.outputs.backend == 'true'
        run: node --test scripts/*.test.mjs

      # scripts/reuse-backend-ci.mjs checks this step for a successful verifyAll run.
      - name: Run tests
        if: needs.changes.outputs.backend == 'true'
        run: ./gradlew verifyAll --configuration-cache --no-daemon --stacktrace

      - name: Verify unsigned local Maven publication
        if: needs.changes.outputs.backend == 'true'
        env:
          SIGNING_KEY_ID: ""
          SIGNING_SECRET_KEY: ""
          SIGNING_SECRET_KEY_BASE64: ""
          SIGNING_PASSWORD: ""
        run: |
          ./gradlew reportMavenPublication --configuration-cache --no-daemon --stacktrace
          if find build/consumer-repo -type f -name '*.asc' -print -quit | grep -q .; then
            echo "Local consumer repository must not contain Maven Central signatures." >&2
            exit 1
          fi

      - name: Skip backend tests
        if: needs.changes.outputs.backend != 'true'
        run: echo "No backend changes detected."

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-results-${{ github.run_attempt }}
          path: "**/build/test-results/**"
          if-no-files-found: ignore

  frontend:
    name: Frontend Build & Test
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: muyun-web/.nvmrc
          cache: npm
          cache-dependency-path: muyun-web/package-lock.json

      - name: Install dependencies
        # Keep clean, lockfile-based installs while avoiding audit/funding network requests.
        # The setup-node npm cache is reused on subsequent runs whenever possible.
        run: npm ci --prefix muyun-web --prefer-offline --no-audit --no-fund

      - name: Verify aligned project version
        run: npm run version:check --prefix muyun-web && npm run version:test --prefix muyun-web

      - name: Run lint
        run: npm run lint --prefix muyun-web

      - name: Check format
        run: npm run format:check --prefix muyun-web

      - name: Run unit and component tests
        run: npm run test:local --prefix muyun-web

      - name: Build
        run: npm run build --prefix muyun-web

      - name: Verify npm consumer
        run: npm run verify:consumer --prefix muyun-web

  frontend-browser:
    name: Frontend Chromium Tests
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: muyun-web

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: muyun-web/.nvmrc
          cache: npm
          cache-dependency-path: muyun-web/package-lock.json

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Install Chromium for Vitest
        run: npx playwright install --with-deps chromium

      - name: Run browser tests
        run: npm run test:browser

  required:
    name: Build & Test (Java 21)
    needs: [changes, backend, frontend, frontend-browser]
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Check CI result
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ needs.changes.result }}" != "success" ]]; then
            echo "Change detection failed."
            exit 1
          fi

          if [[ "${{ needs.backend.result }}" != "success" ]]; then
            echo "Backend CI failed."
            exit 1
          fi

          if [[ "${{ needs.changes.outputs.frontend }}" == "true" ]]; then
            if [[ "${{ needs.frontend.result }}" != "success" ]]; then
              echo "Frontend build or Node/jsdom tests failed."
              exit 1
            fi
            if [[ "${{ needs.frontend-browser.result }}" != "success" ]]; then
              echo "Frontend Chromium tests failed."
              exit 1
            fi
          fi

          echo "CI passed."
